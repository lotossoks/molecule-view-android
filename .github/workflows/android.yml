name: Palmol APK
on: [push, workflow_dispatch]
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with:
      node-version: '22'
   - run: npm ci --no-audit --no-fund && npm run build
     working-directory: web
   - run: python3 scripts/licenses.py
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.11.1'
   - name: Prepare release signing
     env:
      PALMOL_KEYSTORE: ${{ secrets.PALMOL_KEYSTORE }}
     run: echo "$PALMOL_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/palmol.jks"
   - run: gradle assembleDebug assembleRelease lintDebug
     env:
      PALMOL_KEYSTORE_PATH: ${{ runner.temp }}/palmol.jks
      PALMOL_STORE_PASSWORD: ${{ secrets.PALMOL_STORE_PASSWORD }}
   - uses: actions/upload-artifact@v4
     with:
      name: Palmol-release-apk
      path: app/build/outputs/apk/release/*.apk
   - uses: actions/upload-artifact@v4
     with:
      name: Palmol-debug-apk
      path: app/build/outputs/apk/debug/*.apk
   - uses: actions/upload-artifact@v4
     with:
      name: Palmol-build-reports
      path: app/build/reports/
   - name: Enable KVM
     run: |
      echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
      sudo udevadm control --reload-rules
      sudo udevadm trigger --name-match=kvm
   - uses: reactivecircus/android-emulator-runner@v2
     with:
      api-level: 31
      arch: x86_64
      profile: pixel_2
      disable-animations: true
      script: |
       adb install app/build/outputs/apk/debug/app-debug.apk
       python3 scripts/android-smoke.py
   - uses: actions/upload-artifact@v4
     if: always()
     with:
      name: Palmol-android-smoke
      path: |
       android-smoke.png
       android-logcat.txt
